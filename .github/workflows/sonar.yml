name: SonarCloud Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for accurate blame & new-code detection

      - name: Set up JDK 21
        id: setup-java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x ./gradlew

      - name: Inject signing properties (optional)
        env:
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          {
            printf '%s\n' "RELEASE_STORE_FILE=${RELEASE_STORE_FILE}"
            printf '%s\n' "RELEASE_KEY_ALIAS=${RELEASE_KEY_ALIAS}"
            printf '%s\n' "RELEASE_STORE_PASSWORD=${RELEASE_STORE_PASSWORD}"
            printf '%s\n' "RELEASE_KEY_PASSWORD=${RELEASE_KEY_PASSWORD}"
          } >> local.properties

      - name: Prepare SN auth resource (single source)
        shell: bash
        env:
          SN_AUTH_FILE_BASE64: ${{ secrets.SN_AUTH_FILE_BASE64 }}
        run: |
          mkdir -p app/src/main/res/raw
          rm -f app/src/main/res/raw/sn_auth_file.*

          if [ -n "$SN_AUTH_FILE_BASE64" ]; then
            printf '%s' "$SN_AUTH_FILE_BASE64" | base64 --decode > app/src/main/res/raw/sn_auth_file.lc
          else
            echo "sn_auth_placeholder_for_ci" > app/src/main/res/raw/sn_auth_file.lc
          fi

      - name: Build and test all modules with coverage
        run: ./gradlew --no-daemon build testCoverage --stacktrace
        env:
          JAVA_HOME: ${{ steps.setup-java.outputs.path }}

      - name: Verify coverage reports contain executed source lines
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          for module in ("app", "common", "glasses-app", "phone-app"):
              path = pathlib.Path(module) / "build/reports/coverage/test/debug/report.xml"
              report = ET.parse(path).getroot()
              covered = sum(int(line.get("ci", "0")) > 0
                            for line in report.findall("./package/sourcefile/line"))
              if covered == 0:
                  raise SystemExit(f"{path}: no executed source lines in coverage report")
              print(f"{module}: {covered} covered source lines")
          PY
      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon sonar --info; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "SonarCloud analysis failed after ${attempt} attempts."
              exit 1
            fi

            echo "SonarCloud analysis failed (attempt ${attempt}/3). Retrying in 20 seconds..."
            sleep 20
          done

      - name: Upload test, lint, and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
            **/build/reports/coverage/
          retention-days: 7
